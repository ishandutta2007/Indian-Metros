<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse {
      0% { r: 6px; opacity: 0.7; }
      50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #06b6d4); }
      100% { r: 6px; opacity: 0.7; }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .node {
      animation: pulse 3s infinite ease-in-out;
    }
    .node-2 {
      animation: pulse 4s infinite ease-in-out 1s;
    }
    .conn-line {
      stroke-dasharray: 8, 4;
      animation: dash 2s linear infinite;
    }
    .floating-group {
      animation: float 6s infinite ease-in-out;
    }
    .text-title {
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 4px;
    }
    .text-subtitle {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      fill: #cbd5e1;
      letter-spacing: 2px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Glow and Data beams in background -->
  <path d="M-100,350 C300,300 500,150 1300,280" fill="none" stroke="url(#glowGrad)" stroke-width="120" opacity="0.15"/>
  <path d="M-100,350 C300,300 500,150 1300,280" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" class="conn-line"/>

  <!-- Stylized Indian Skyline silhouettes (representing cities) -->
  <g fill="url(#skylineGrad)" opacity="0.8">
    <!-- Mumbai & Delhi inspired abstract skyline shapes -->
    <path d="M 0,400 L 0,320 L 30,320 L 30,280 L 65,280 L 65,340 L 90,340 L 90,260 L 120,260 L 120,300 L 140,300 L 140,240 L 155,210 L 170,240 L 170,330 L 200,330 L 200,290 L 250,290 L 250,350 L 290,350 L 290,270 L 330,270 L 330,310 L 380,310 L 380,250 L 400,250 L 400,340 L 440,340 L 440,300 L 490,300 L 490,400 Z" />
    <path d="M 750,400 L 750,330 L 780,330 L 780,280 L 810,280 L 810,310 L 850,310 L 850,230 L 880,230 L 880,320 L 920,320 L 920,260 L 960,260 L 960,340 L 1010,340 L 1010,290 L 1050,290 L 1050,350 L 1100,350 L 1100,270 L 1150,270 L 1150,320 L 1200,320 L 1200,400 Z" />
  </g>

  <!-- Interactive/Dynamic Tech Nodes and connections representing Metros -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <line x1="155" y1="210" x2="330" y2="270" class="conn-line" />
    <line x1="330" y1="270" x2="520" y2="180" class="conn-line" />
    <line x1="520" y1="180" x2="680" y2="240" class="conn-line" stroke-dasharray="5,5"/>
    <line x1="680" y1="240" x2="850" y2="230" class="conn-line" />
    <line x1="850" y1="230" x2="1100" y2="270" class="conn-line" />
  </g>

  <!-- Node Dots (with pulsating animation) -->
  <circle cx="155" cy="210" r="8" fill="#38bdf8" class="node" />
  <circle cx="330" cy="270" r="8" fill="#f43f5e" class="node-2" />
  <circle cx="520" cy="180" r="10" fill="#10b981" class="node" />
  <circle cx="680" cy="240" r="8" fill="#eab308" class="node-2" />
  <circle cx="850" cy="230" r="8" fill="#38bdf8" class="node" />
  <circle cx="1100" cy="270" r="8" fill="#a855f7" class="node-2" />

  <!-- Center Floating Content Group (Typography) -->
  <g class="floating-group">
    <!-- Decorative India Map abstract shape behind text -->
    <path d="M 600,80 Q 640,110 620,150 T 630,220 T 580,260 T 570,200 Z" fill="#ffffff" opacity="0.03" />

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="text-title" font-size="46" fill="#ffffff" filter="url(#glow)">INDIAN METROS</text>
    <text x="600" y="150" text-anchor="middle" class="text-title" font-size="46" fill="url(#accentGrad)">INDIAN METROS</text>
    
    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" class="text-subtitle" font-size="18">GDP &amp; ECONOMY ANALYZER</text>
    
    <!-- Decorative underline -->
    <rect x="450" y="225" width="300" height="3" rx="1.5" fill="url(#accentGrad)" />
  </g>

  <!-- Border Frame -->
  <rect x="15" y="15" width="1170" height="370" rx="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>
